# Reglas de formato para los títulos que se envían a Google Tasks y Google Calendar.
# Copia este archivo a format_rules.toml y adáptalo.
#
# Las reglas se aplican en orden, cada una sobre el resultado de la anterior.
# Se aplican al título completo, que antes de formatear es:
#   - Tareas:   "<nombre> (<asignatura>)"
#   - Tutorías: "<título>"
#
# Tipos de regla (usa uno):
#   find    = "texto"   → reemplazo literal
#   pattern = '...'     → regex (sintaxis de Python `re`); en 'replace' usa \1, \2 o \g<nombre>
#
# Opcionales:
#   applies_to  = ["tasks", "events"]   (por defecto: ambos)
#   ignore_case = true
#
# Usa comillas simples '...' para las regex: así las barras invertidas no se escapan.
#
# Prueba las reglas sin tocar Google con:  cesur-sync-google --preview

[[rules]]
pattern = '^(.+?) \((.+?)(?: - [A-Z]{3})?\)$'
replace = '[\2] \1'
applies_to = ["tasks"]

[[rules]]
find = "Desarrollo de Interfaces"
replace = "Desarrollo Interfaces"
