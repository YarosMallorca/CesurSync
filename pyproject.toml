[project]
name = "cesur-sync"
version = "0.1.0"
description = "Scraper de campus online de Cesur para sincronizar tareas y entregas con Google Tasks & Calendar"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "dateparser>=1.2",
    "requests>=2.32",
    "google-api-python-client>=2.200.0",
    "google-auth-oauthlib>=1.4.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
cesur-login = "cesur_sync.login:main"
cesur-scrape = "cesur_sync.scrape:main"
cesur-google-login = "cesur_sync.google_auth:main"
cesur-sync-google = "cesur_sync.google_sync:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.16.8"]
